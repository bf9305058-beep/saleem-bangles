<!DOCTYPE html>
<html>
<head>
<title>INSIGHT COLLECTION - SALEEM BANGLES</title>
<style>
body{font-family:'Segoe UI',Arial; background:#f8f8f8; margin:0; padding:0;}
.header{background:#fc2779; color:white; padding:15px; text-align:center; position:sticky; top:0;}
.header h1{margin:0; font-size:22px;}
.container{max-width:1200px; margin:20px auto; padding:0 15px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px;}
.card{background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.card img{width:100%; height:300px; object-fit:cover;}
.card-body{padding:15px;}
.card h3{font-size:16px; margin:5px 0; color:#333;}
.price{font-size:18px; font-weight:bold; color:#000;}
.old-price{text-decoration:line-through; color:gray; font-size:14px; margin-left:5px;}
.offer{color:#06a759; font-size:13px; font-weight:bold; margin:5px 0;}
.btn{background:#fc2779; color:white; padding:10px; border:none; width:100%; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; margin-top:8px;}
.btn:hover{background:#e01e6a;}
.back-btn{display:block; text-align:center; margin:20px; color:#fc2779; text-decoration:none; font-weight:bold;}
.shade-select{width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1.5px solid #fc2779; font-size:14px; background:#fff0f5;}
</style>
</head>
<body>

<div class="header"><h1>INSIGHT COLLECTION</h1></div>

<div class="container">
  <div class="grid">

    <div class="card">
     <img src="insight-kajal.jpg">
      <div class="card-body">
        <h3>Insight Intense Color Kajal</h3>
        <p class="price">₹130</p>
        <button class="btn" onclick="window.location.href='https://wa.me/917703067297?text=Hi, I want Insight Intense Kajal'">Add to Bag</button>
      </div>
    </div>

    <div class="card">
     <img src="insight-lipstick.jpg" style="object-fit:contain; background:#ffe4ec;">
      <div class="card-body">
        <h3>Insight 24 Hrs Non Transfer Matte Lipstick</h3>
        <p class="price">₹310 <span class="old-price">MRP ₹310</span></p>
        <p class="offer">🔥 BUY 2 GET 1 FREE 🔥 - 24 Shades Available</p>
        
        <!-- YEH NAYA SHADE SELECTOR -->
        <label style="font-weight:bold; font-size:13px;">Apna Shade Select Karo:</label>
        <select id="lipstickShade" class="shade-select">
          <option value="">-- Shade Chuniye --</option>
          <option value="01 - WAKE-UP ME UP">01 - WAKE-UP ME UP</option>
          <option value="02 - BITCH">02 - BITCH</option>
          <option value="03 - OH SHIT">03 - OH SHIT</option>
          <option value="04 - FORGET ME (BEST SELLER)">04 - FORGET ME ⭐ BEST SELLER</option>
          <option value="05 - HOW YOU DOING">05 - HOW YOU DOING</option>
          <option value="06 - SEND NUDES">06 - SEND NUDES</option>
          <option value="07 - STAY BASIC">07 - STAY BASIC</option>
          <option value="08 - STAY BASIC">08 - STAY BASIC</option>
          <option value="09 - BLOOD HOUND">09 - BLOOD HOUND</option>
          <option value="10 - PINKITY POOH">10 - PINKITY POOH</option>
          <option value="11 - RED SEEKER">11 - RED SEEKER</option>
          <option value="12 - STAY TAN">12 - STAY TAN</option>
          <option value="13 - SUMMER PEACH">13 - SUMMER PEACH</option>
          <option value="14 - SPIRALING">14 - SPIRALING</option>
          <option value="15 - BLOOD LUST">15 - BLOOD LUST</option>
          <option value="16 - YES PLEASE!">16 - YES PLEASE!</option>
          <option value="17 - HOTTIE">17 - HOTTIE</option>
          <option value="18 - LOOKING GOOD">18 - LOOKING GOOD</option>
          <option value="19 - HOW ARE YOU">19 - HOW ARE YOU</option>
          <option value="20 - YOU ARE SO SESSY">20 - YOU ARE SO SESSY</option>
          <option value="21 - TOO CHIC!">21 - TOO CHIC!</option>
          <option value="22 - ALWAYS CLASSY">22 - ALWAYS CLASSY</option>
          <option value="23 - DIVA">23 - DIVA</option>
          <option value="24 - INSTAGRAM">24 - INSTAGRAM</option>
        </select> 

        <button class="btn" onclick="orderWithShade()">Add to Bag with Shade</button>
      </div>
    </div>
    <div class="card">
     <img src="insight-highlighter.jpg" style="object-fit:contain; background:#fff8f0;">
      <div class="card-body">
        <h3>Insight Highlighter - Glow That Defines You</h3>
        <p class="price">₹135</p>
        <p class="offer">✨ 5 Shades Available ✨</p>
        
        <label style="font-weight:bold; font-size:13px;">Apna Shade Select Karo:</label>
        <select id="highlighterShade" class="shade-select">
          <option value="">-- Shade Chuniye --</option>
          <option value="01 - MERMAID SCALE">01 - MERMAID SCALE - Icy champagne</option>
          <option value="03 - ANGELIC BEAUTY">03 - ANGELIC BEAUTY - Warm golden</option>
          <option value="04 - FROSTED HEART">04 - FROSTED HEART - Rose gold ⭐</option>
          <option value="05 - SAVAGE BARBIE">05 - SAVAGE BARBIE - Peachy pink</option>
          <option value="06 - COSMIC POWER">06 - COSMIC POWER - Deep golden</option>
        </select>

        <button class="btn" onclick="orderHighlighter()">Add to Bag with Shade</button>
      </div>
    </div>
  </div>
</div>

    </div>

  <!-- YAHAN ADD KARO BEN - YOUR CART -->
  <div id="cartSection" style="background:white; border:2px solid #ffb6d9; border-radius:12px; padding:15px; max-width:700px; margin:30px auto;">
    <h3>🛒 Your Cart</h3>
    <div id="cartItems">Cart Khali hai</div>
    <p id="cartTotal"><b>Total: ₹0</b></p>
    <button onclick="orderAllWA()" style="width:100%;padding:10px;background:#00c851;color:white;border:none;border-radius:6px;font-weight:bold;margin-top:8px;cursor:pointer;">Order on WhatsApp</button>
    <button onclick="payAll()" style="width:100%;padding:10px;background:#ff6a00;color:white;border:none;border-radius:6px;font-weight:bold;margin-top:8px;cursor:pointer;">Proceed to Checkout - Payment 💳</button>
    <button onclick="clearCart()" style="width:100%;padding:6px;background:white;border:1px solid #ddd;border-radius:6px;margin-top:8px;">Clear Cart</button>
  </div>

  <a href="cosmetics.html" class="back-btn">← Back to All Brands</a>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem('cart')||'[]');

function orderWithShade(){
  var shade = document.getElementById('lipstickShade').value;
  if(shade == ""){ alert("Ben pehle shade select karo! 👆"); return; }
  addToCart("Insight 24 Hrs Lipstick", shade, 110);
}
function orderHighlighter(){
  var shade = document.getElementById('highlighterShade').value;
  if(shade == ""){ alert("Ben pehle highlighter ka shade select karo! 👆"); return; }
  addToCart("Insight Highlighter", shade, 135);
}

function addToCart(name, shade, price){
  let c = JSON.parse(localStorage.getItem('cart')||'[]');
  c.push({name: name + " - " + shade, price: price, qty: 1});
  localStorage.setItem('cart', JSON.stringify(c));
  renderCart();
  alert(name + " " + shade + " Cart me add ✅");
}
function renderCart(){
  let c = JSON.parse(localStorage.getItem('cart')||'[]');
  let html=''; let total=0;
  c.forEach((it,i)=>{ total+=it.price; html+=`${it.name} - ₹${it.price} <span onclick="removeItem(${i})" style="background:red;color:white;padding:0 6px;border-radius:3px;cursor:pointer;margin-left:5px">X</span><br>`; });
  document.getElementById('cartItems').innerHTML = html || 'Cart Khali hai';
  document.getElementById('cartTotal').innerHTML = '<b>Total: ₹'+total+'</b>';
}
function removeItem(i){ let c=JSON.parse(localStorage.getItem('cart')||'[]'); c.splice(i,1); localStorage.setItem('cart', JSON.stringify(c)); renderCart(); }
function clearCart(){ localStorage.removeItem('cart'); renderCart(); }
function orderAllWA(){
  let c=JSON.parse(localStorage.getItem('cart')||'[]'); if(!c.length){alert('Cart khali hai');return;}
  let m='Insight Order:%0A'; let t=0;
  c.forEach(it=>{ m+=`${it.name}=₹${it.price}%0A`; t+=it.price; });
  m+=`Total: ₹${t}`;
  window.open('https://wa.me/917703067297?text='+encodeURIComponent(m),'_blank');
}
function payAll(){
  let c=JSON.parse(localStorage.getItem('cart')||'[]'); if(!c.length){alert('Cart khali hai');return;}
  let t=0; c.forEach(it=>t+=it.price);
  var opt={key:"rzp_test_XXXXXXX", amount:t*100, currency:"INR", name:"Saleem Bangle Store", description:"Insight Order", handler:function(r){ alert('Payment ID: '+r.razorpay_payment_id); orderAllWA(); }, theme:{color:"#e91e63"}};
  new Razorpay(opt).open();
}
renderCart();
</script>

</body>
</html>
