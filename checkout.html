<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Saleem Bangles</title>
<style>body{font-family:Poppins,sans-serif;background:#f8f9fa;margin:0;padding:15px}.box{background:white;border-radius:15px;padding:20px;max-width:500px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}h2{text-align:center;color:#d63384}.qr{text-align:center;background:#fff8dc;padding:15px;border-radius:12px;border:1px solid #ffc107;margin:15px 0}.btn{width:100%;padding:14px;background:#25D366;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}</style>
</head>
<body>
<div class="box">

<input id="u" placeholder="UTR / Transaction ID">
<button class="btn" onclick="let N=document.getElementById('n').value,A=document.getElementById('a').value,U=document.getElementById('u').value;if(!N||!A||!U){alert('Saare box bharo!');return}let m=`*NEW ORDER*%0AName:${N}%0AAddress:${A}%0AUTR:${U}`;window.open('https://wa.me/917703067297?text='+m)">📲 WhatsApp Pe Order Bhejo</button>
