<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Rose 28 Colors - Saleem Bangles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:Poppins,Arial; background:#fff5f7; margin:0; padding:10px}
.box{max-width:1000px; margin:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px}
.card{background:white; border-radius:16px; padding:14px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.08)}
.card img{width:auto; max-width:100%; height:auto; max-height:210px; display:block; margin:0 auto; object-fit:contain; background:#fff9f2; padding:8px; border-radius:12px; cursor:zoom-in}
.price{color:#0d8a4a; font-weight:800; font-size:18px} .mrp{color:gray; font-size:13px}
.btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; cursor:pointer; margin-top:8px}
.btn-black{background:black; color:white}
.cart-box{background:white; max-width:600px; margin:20px auto; padding:15px; border-radius:14px; box-shadow:0 4px 15px rgba(0,0,0,0.08)}
.btn-wa{background:#25D366; color:white; width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; margin-top:8px} 
.btn-pay{background:#ff6f00; color:white; width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; margin-top:8px}
.btn-clear{background:white; border:1px solid #ddd; color:#555; width:100%; padding:10px; border-radius:10px; margin-top:8px}
.backs{display:flex; gap:10px; justify-content:center; margin:20px 0; flex-wrap:wrap}
.backs a{padding:10px 18px; border-radius:20px; text-decoration:none; color:white; font-weight:600; font-size:13px}
.black{background:black} .pink{background:#e91e63}
#imgModal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center}
#imgModal img{max-width:95%; max-height:90%; border-radius:12px}
.footer{text-align:center; font-size:12px; color:#666}
</style>
</head>
<body>
<div class="box">
<div class="card">
<img src="angle-rose-eyeshadow.jpg" onclick="openPop(this.src)">
<h4>Angel Rose 28 Colors Eyeshadow</h4>
<p class="mrp">MRP <s>Rs. 699</s></p>
<p class="price">Rs. 349 Only 🔥</p>
<button class="btn btn-black" onclick="addToCart('Angel Rose 28 Colors Eyeshadow', 349)">Add to Cart</button>
</div>
</div>

<div class="cart-box">
<h3>🛒 Your Cart</h3>
<div id="cartItems">Cart Khali Hai 🛒</div>
<div id="cartTotal" style="font-weight:800; margin-top:10px;"></div>
<button class="btn-wa" onclick="orderAllWA()" id="waBtn" style="display:none;">Order on WhatsApp</button>
<button class="btn-pay" onclick="goCheckout()" id="checkBtn" style="display:none;">Proceed to Checkout - Payment 💳</button>
<button class="btn-clear" onclick="clearCart()" id="clearBtn" style="display:none;">Clear Cart</button>
</div>

<div class="backs"><a href="cosmetics.html" class="black">← Back to All Brands</a><a href="index.html" class="pink">← Back to Bangles</a></div>
<div class="footer">Saleem Bangle Store - Akbargada Lucknow 226003<br>📞 7703067297</div>
<div id="imgModal" onclick="closePop()"><img id="modalImg" src=""></div>

<script src="cart-common.js"></script>
<script>
function openPop(s){document.getElementById("modalImg").src=s;document.getElementById("imgModal").style.display="flex";}
function closePop(){document.getElementById("imgModal").style.display="none";}
function goCheckout(){ window.location.href="checkout.html"; }
window.onload = function(){ renderCart(); updateCartCount(); }
</script>
</body>
</html>
