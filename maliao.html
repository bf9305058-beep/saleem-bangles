<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maliao - Saleem Bangles</title>
<style>
body{font-family:Poppins,Arial;background:#fff5f7;margin:0;padding:10px;padding-bottom:30px}
h1{text-align:center;color:#e91e63}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.card{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);cursor:pointer}
.card img{width:100%;height:160px;object-fit:contain;border-radius:8px}
.card h3{font-size:13px;margin:8px 0 4px;min-height:32px}
.mrp{font-size:11px;color:#888;text-decoration:line-through}
.price{font-size:15px;font-weight:700;color:#111}
.off{font-size:11px;color:green;font-weight:600}
.shade{width:100%;padding:6px;margin:6px 0;border:1px solid #ddd;border-radius:6px;font-size:12px}
.btn{width:100%;padding:8px;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-orange{background:#ff6a00;color:white}
.btn-green{background:#111;color:white}
/* YAHAN SE CART CHOTA KIYA */
#cartBox{
  background:white;
  padding:14px;
  border-radius:14px;
  margin-top:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.12);
  max-width:380px;
  margin-left:auto;
  margin-right:auto;
  border:1px solid #ffe0e8;
}
#cartList{max-height:150px;overflow-y:auto}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed #eee;font-size:12.5px}
.del-btn{background:#ff3b3b;color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:800}
#popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:999}
#popupBox{background:white;padding:20px;border-radius:16px;max-width:320px;text-align:center;position:relative}
#popupClose{position:absolute;top:10px;right:15px;font-size:20px;cursor:pointer}
</style></head><body>
<h1>MALIAO PRODUCTS</h1>
<div id="grid"></div>
<div id="cartBox"><h3 style="margin:0 0 8px 0;font-size:15px">🛒 Cart - <span id="total">₹0</span></h3><div id="cartList"></div><button class="btn btn-green" onclick="goCheckout()" style="margin-top:10px">Proceed to Checkout</button><button class="btn" style="background:#f5f5f5;margin-top:8px;font-size:12px" onclick="clearCart()">Clear Cart</button><br><br><a href="cosmetics.html" style="color:#e91e63;text-decoration:none;font-weight:600;font-size:13px">← Back to All Brands</a></div>
<div id="popup" onclick="closePop()"><div id="popupBox" onclick="event.stopPropagation()"><span id="popupClose" onclick="closePop()">X</span><img id="popImg" src="" style="width:100%;border-radius:10px"><h3 id="popName"></h3><div id="popMrp"></div><div id="popRate" style="font-weight:700;font-size:18px"></div></div></div>
<script>
const products=[
{name:"Maliao Jed Black Kajal", mrp:199, rate:149, fd:false, img:"maliao-jed-black.jpg"},
{name:"Maliao Black Kajal", mrp:199, rate:159, fd:false, img:"maliao-jet-black-kajal.jpg"},
{name:"Maliao White Kajal", mrp:190, rate:179, fd:false, img:"maliao-white-kajal.jpg"},
{name:"Maliao 7 in 1 Cream", mrp:650, rate:500, fd:false, img:"maliao-7in-1-cream.jpg"},
{name:"Maliao Black Fixer", mrp:349, rate:279, fd:false, img:"maliao-black-fixer.jpg"},
{name:"Maliao Shimer Fixer", mrp:499, rate:349, fd:false, img:"maliao-shimer-fixer.jpg", shades:["01 Golden","02 Pink","03 Silver"]},
{name:"Maliao Pearl", mrp:299, rate:199, fd:false, img:"maliao-pearl.jpg", shades:["Silver","Pink","Golden Pink"]},
{name:"Maliao Green Toner", mrp:349, rate:219, fd:false, img:"maliao-green-toner.jpg"},
{name:"Maliao Rose Toner", mrp:349, rate:219, fd:false, img:"maliao-rose-toner.jpg"},
{name:"Maliao V-C Serum", mrp:449, rate:359, fd:false, img:"maliao-v+c-sirum.jpg"},
{name:"High Cover Maliao", mrp:399, rate:290, fd:true, img:"maliao-high-coverj-foundation.jpg"},
{name:"Color Changing", mrp:499, rate:379, fd:true, img:"maliao-colorchenging.jpg"},
{name:"BB Cream Foundation", mrp:299, rate:199, fd:true, img:"maliao-bb-cream-foundation.jpg"},
{name:"Maliao HD Tube", mrp:299, rate:219, fd:true, img:"maliao-hd-tube.jpg"},
{name:"Maliao Golden Tube", mrp:299, rate:230, fd:true, img:"maliao-golden-tube.jpg"},
{name:"Maliao Aloe Vera Green Tea", mrp:299, rate:220, fd:true, img:"maliao-alov-fondation.jpg"},
{name:"Liner - Mascara Combo", mrp:199, rate:200, fd:false, img:"maliao-liner-mascara-combo.jpg"},
{name:"Maliao HD Glass", mrp:399, rate:299, fd:true, img:"maliao-hd-glass-faoundation.jpg"},
];
let cart=JSON.parse(localStorage.getItem('sb_cart')||'[]');
let grid=document.getElementById('grid'); grid.innerHTML="";
products.forEach((p,i)=>{
let off=Math.round((p.mrp-p.rate)/p.mrp*100);
let shadeHtml = "";
if(p.shades){
  let opts = p.shades.map(s=>`<option>${s}</option>`).join("");
  shadeHtml = `<select id="s${i}" class="shade" onclick="event.stopPropagation()"><option value="">-- Shade Chuniye --</option>${opts}</select><button class="btn btn-orange" onclick="event.stopPropagation();add(${i})">Add with Shade</button>`;
} else if(p.fd){
  shadeHtml = `<select id="s${i}" class="shade" onclick="event.stopPropagation()"><option value="">-- Shade Chuniye --</option><option>Shade 01</option><option>Shade 02</option><option>Shade 03</option></select><button class="btn btn-orange" onclick="event.stopPropagation();add(${i})">Add with Shade</button>`;
} else {
  shadeHtml = `<button class="btn btn-green" onclick="event.stopPropagation();add(${i})">Add to Cart</button>`;
}
grid.innerHTML+=`<div class="card" onclick="openPop('${p.img}','${p.name}',${p.mrp},${p.rate})"><img src="${p.img}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/200x200?text='+encodeURIComponent(p.name)"><h3>${p.name}</h3><div class="mrp">MRP ₹${p.mrp}</div><div class="price">₹${p.rate}</div><div class="off">${off}% OFF</div>${shadeHtml}</div>`;
});
function openPop(img,name,mrp,rate){document.getElementById('popImg').src=img;document.getElementById('popName').innerText=name;document.getElementById('popMrp').innerText="MRP ₹"+mrp;document.getElementById('popRate').innerText="₹"+rate;document.getElementById('popup').style.display='flex';}
function closePop(){document.getElementById('popup').style.display='none';}
function add(i){let s="";if(products[i].shades || products[i].fd){s=document.getElementById('s'+i).value;if(!s){alert('Shade Chuniye');return}}cart.push({...products[i],shade:s});localStorage.setItem('sb_cart',JSON.stringify(cart));update()}
function update(){let h="",t=0;cart.forEach((c,idx)=>{t+=c.rate;let sh=c.shade?` (${c.shade})`:"";h+=`<div class="cart-item"><span>${c.name}${sh} - ₹${c.rate}</span><button class="del-btn" onclick="cart.splice(${idx},1);localStorage.setItem('sb_cart',JSON.stringify(cart));update()">X</button></div>`;});document.getElementById('cartList').innerHTML=h||"<div style='color:#888;font-size:12px;padding:10px 0'>Cart Khali Hai</div>";document.getElementById('total').innerText="₹"+t;}
function clearCart(){cart=[];localStorage.setItem('sb_cart',JSON.stringify(cart));update()}
function goCheckout(){if(cart.length==0){alert('Cart Khali hai');return}localStorage.setItem('sb_cart',JSON.stringify(cart));location.href='checkout.html'}
update();
</script></body></html>
