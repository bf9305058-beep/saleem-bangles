<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Maliao</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}.header{background:#000;color:#ffd700;text-align:center;padding:14px;border-radius:10px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px auto;max-width:1100px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;text-align:center}.card img{width:100%;height:150px;object-fit:contain}.btn{width:100%;padding:10px;border-radius:20px;border:none;font-weight:bold;margin-top:6px}.btn-green{background:#111;color:#ffd700}.btn-orange{background:#ff6f00;color:#fff}.shade{width:100%;padding:7px;border-radius:8px;margin:5px 0}#cartBox{max-width:500px;margin:20px auto;background:#fff;padding:15px;border-radius:12px}</style>
</head><body>
<a href="cosmetics.html" style="background:black;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none">⬅ Back</a>
<div class="header">💄 MALIAO - 15 UNIQUE ITEMS</div>
<div class="grid" id="grid"></div>
<div id="cartBox"><h3>🛒 Cart</h3><div id="citems">Cart Khali hai</div><h3>Total: ₹<span id="total">0</span></h3><button onclick="location.href='checkout.html'" style="width:100%;background:#ff6f00;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:bold">Proceed to Checkout</button></div>
<script>
const products=[
{n:"Maliao White Kajal",m:190,r:179,f:0,i:"maliao-white-kajal.jpg"},
{n:"Maliao 7 in 1 Cream",m:650,r:500,f:0,i:"maliao-high-coverj-foundation.jpg"},
{n:"Maliao Black Fixer",m:349,r:279,f:0,i:"maliao-shimer-fixer.jpg"},
{n:"Maliao Shimer Fixer",m:499,r:349,f:0,i:"maliao-shimer-fixer.jpg"},
{n:"Maliao Pearl",m:299,r:199,f:0,i:"maliao-hd-glass-faoundation.jpg"},
{n:"Green Toner",m:349,r:219,f:0,i:"maliao-green-toner.jpg"},
{n:"Rose Toner",m:349,r:219,f:0,i:"maliao-rose-toner.jpg"},
{n:"V-C Serum",m:449,r:359,f:0,i:"maliao-v+c-sirum.jpg"},
{n:"High Cover",m:399,r:290,f:1,i:"maliao-high-coverj-foundation.jpg"},
{n:"Color Changing",m:499,r:379,f:1,i:"maliao-hd-glass-faoundation.jpg"},
{n:"Maliao HD Tube",m:299,r:219,f:1,i:"maliao-hd-tube.jpg"},
{n:"Maliao Golden Tube",m:299,r:230,f:1,i:"maliao-golden-tube.jpg"},
{n:"Liner Mascara Combo",m:299,r:200,f:0,i:"maliao-liner-mascara-combo.jpg"},
{n:"Maliao Mascara",m:199,r:200,f:0,i:"maliao-liner-mascara-combo.jpg"},
{n:"Maliao HD Glass",m:399,r:299,f:1,i:"maliao-hd-glass-faoundation.jpg"},
];
let cart=JSON.parse(localStorage.getItem('sb_cart')||'[]');
let grid=document.getElementById('grid');
grid.innerHTML=""; // IMPORTANT - Double hatane ke liye
products.forEach((p,idx)=>{
let off=Math.round((p.m-p.r)/p.m*100);
let shade=p.f?`<select id="s${idx}" class="shade"><option value="">-- Shade Chuniye --</option><option>Shade 01</option><option>Shade 02</option></select><button class="btn btn-orange" onclick="add(${idx})">Add with Shade ₹${p.r}</button>`:`<button class="btn btn-green" onclick="add(${idx})">Add to Cart ₹${p.r}</button>`;
grid.innerHTML+=`<div class="card"><img src="${p.i}"><h3>${p.n}</h3><div style="font-size:11px;color:#888;text-decoration:line-through">MRP ₹${p.m}</div><div style="color:#e91e63;font-weight:bold">₹${p.r} - ${off}% OFF</div>${shade}</div>`;
});
function add(i){let s="";if(products[i].f){s=document.getElementById('s'+i).value;if(!s){alert('Shade Chuniye');return}}cart.push({...products[i],shade:s,rate:products[i].r,name:products[i].n});localStorage.setItem('sb_cart',JSON.stringify(cart));update()}
function update(){let h="",t=0;cart.forEach((c,i)=>{t+=c.rate;let sh=c.shade?` (${c.shade})`:"";h+=`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${c.name}${sh}</span><span>₹${c.rate} <b onclick="cart.splice(${i},1);localStorage.setItem('sb_cart',JSON.stringify(cart));update()" style="color:red">x</b></span></div>`});document.getElementById('citems').innerHTML=h||"Cart Khali hai";document.getElementById('total').innerText=t;localStorage.setItem('sb_total',t)}
update();
</script></body></html>
