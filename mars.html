<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARS Foundation</title>
<style>
body{font-family:Arial;background:#fff8f0;margin:0;padding:10px}
.card{max-width:400px;margin:auto;background:white;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 10px #ccc}
img{width:100%;border-radius:10px}
.old{text-decoration:line-through;color:grey}
.new{color:red;font-size:24px;font-weight:bold}
select,input{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.red{background:#c0392b;color:white}
.green{background:#25D366;color:white}
.orange{background:#e67e22;color:white}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.del{background:#ffdddd;padding:5px 10px;border-radius:5px;cursor:pointer;border:none}
</style>
</head>
<body>

<div class="card">
<h3>Saleem Bangles & Cosmetics</h3>
<img src="mars-foundation.jpg">
<h3>MARS Foundation SPF 50</h3>
<p><span class="old">MRP ₹379</span><br><span class="new">Our Price ₹340</span></p>

<select id="shade">
<option value="">Shade Chuno</option>
<option>01</option><option>02</option><option>03</option>
<option>04</option><option>05</option><option>06</option>
</select>

<input type="number" id="qty" value="1" min="1">
<button class="red" onclick="addToBag()">Add to Bag 🛍️</button>

<h4 style="text-align:left;margin-top:20px">🛒 Your Cart</h4>
<div id="cart" style="text-align:left">Cart Khali hai</div>
<h4 id="total">Total: ₹0</h4>

<button class="green" onclick="orderWA()">Order on WhatsApp</button>
<button class="orange" onclick="window.location.href='checkout.html'">Proceed to Checkout 💳</button>
<button onclick="clearCart()">Clear Cart</button>
<a href="brands.html" style="display:block;margin-top:20px;color:#c0392b">← Back to All Brands</a>
</div>

<script>
let cart=JSON.parse(localStorage.getItem('saleemCart')||'[]');
show();

function addToBag(){
 let s=document.getElementById('shade').value;
 let q=parseInt(document.getElementById('qty').value)||1;
 if(!s){alert('Shade chuno!');return;}
 let name='MARS Shade-'+s;
 let f=cart.find(i=>i.name==name);
 if(f) f.qty+=q; else cart.push({name:name,price:340,qty:q});
 localStorage.setItem('saleemCart',JSON.stringify(cart));
 show();
}

function show(){
 let div=document.getElementById('cart');
 let t=0;
 if(cart.length==0){div.innerHTML='Cart Khali hai';document.getElementById('total').innerText='Total: ₹0';return;}
 let h='';
 cart.forEach((c,i)=>{
  t+=c.price*c.qty;
  h+=`<div class="item"><span>${c.name} x ${c.qty} = ₹${c.price*c.qty}</span><button class="del" onclick="delItem(${i})">🗑️</button></div>`;
 });
 div.innerHTML=h;
 document.getElementById('total').innerText='Total: ₹'+t;
}

function delItem(i){
 cart.splice(i,1);
 localStorage.setItem('saleemCart',JSON.stringify(cart));
 show();
}

function clearCart(){
 cart=[];localStorage.removeItem('saleemCart');show();
}

function orderWA(){
 if(cart.length==0){alert('Cart khali hai');return;}
 let msg='Hello Saleem Bangles, order:%0A';
 let tot=0;
 cart.forEach(c=>{msg+=c.name+' x '+c.qty+' = ₹'+(c.price*c.qty)+'%0A';tot+=c.price*c.qty;});
 msg+='Total: ₹'+tot;
 window.open('https://wa.me/917703067297?text='+msg,'_blank');
}
</script>

</body>
</html>
