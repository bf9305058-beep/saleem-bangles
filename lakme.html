<script>
let qty=1;
function upd(){ qty = parseInt(document.getElementById('qty').value) || 1; document.getElementById('total').innerText = "Total: ₹"+ (qty*200); }

function addToCart(){
  var shade = document.getElementById('shade').value;
  if(shade==""){ alert("Ben pehle shade select karo! 👆"); return; }
  let c = JSON.parse(localStorage.getItem('saleem_cart')||'[]');
  c.push({name: "Lakme Face Powder - Shade " + shade, price: 200*qty, size: shade});
  localStorage.setItem('saleem_cart', JSON.stringify(c));
  renderCart();
  alert("Lakme "+shade+" Cart me add ✅");
}
function renderCart(){
  let c = JSON.parse(localStorage.getItem('saleem_cart')||'[]');
  let html=''; let total=0;
  c.forEach((it,i)=>{ total+=it.price; html+= it.name + " - ₹" + it.price + " <span onclick='removeItem("+i+")' style='background:red;color:white;padding:0 6px;border-radius:3px;cursor:pointer;margin-left:5px'>X</span><br>"; });
  document.getElementById('cartItems').innerHTML = html || 'Cart Khali hai';
  document.getElementById('cartTotal').innerHTML = '<b>Total: ₹'+total+'</b>';
}
function removeItem(i){ let c=JSON.parse(localStorage.getItem('saleem_cart')||'[]'); c.splice(i,1); localStorage.setItem('saleem_cart', JSON.stringify(c)); renderCart(); }
function clearCart(){ localStorage.removeItem('saleem_cart'); renderCart(); }
function orderAllWA(){
  let c=JSON.parse(localStorage.getItem('saleem_cart')||'[]'); if(!c.length){alert('Cart khali hai');return;}
  let m='Order:%0A'; let t=0;
  c.forEach(it=>{ m+= it.name + "=₹" + it.price + "%0A"; t+=it.price; });
  m+= "Total: ₹" + t;
  window.open('https://wa.me/917703067297?text='+encodeURIComponent(m),'_blank');
}
function payAll(){
  let c=JSON.parse(localStorage.getItem('saleem_cart')||'[]'); if(!c.length){alert('Cart khali hai');return;}
  let t=0; c.forEach(it=>t+=it.price);
  var opt={key:"rzp_test_XXXXXXX", amount:t*100, currency:"INR", name:"Saleem Bangle Store", description:"Order", handler:function(r){ alert('Payment ID: '+r.razorpay_payment_id); orderAllWA(); }, theme:{color:"#e91e63"}};
  new Razorpay(opt).open();
}
renderCart();
</script>
