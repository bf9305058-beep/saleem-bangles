<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; text-align:center; padding:10px; margin:0; background:#fff;}
.img-box{position:relative; display:inline-block; max-width:500px; width:100%;}
.img-box img{width:100%; border-radius:15px;}
.badge{position:absolute; top:10px; right:10px; background:red; color:white; padding:12px 15px; border-radius:50%; font-weight:bold; font-size:18px; width:60px; height:60px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,0.3);}
.price{font-size:16px;}
.offer{color:red; font-weight:bold; font-size:22px;}
.shade-btn{padding:10px 20px; margin:8px; border-radius:25px; border:1px solid #ff6b9d; background:white; color:#ff6b9d; font-weight:bold;}
.shade-btn.active{background:#ff6b9d; color:white;}
</style>
</head>
<body>

<h2>LAKME Face Powder</h2>

<div class="img-box">
<img src="lakme-powder.jpg">
<div class="badge">20%<br>OFF</div>
</div>

<p><b>Shade:</b> 01 Soft Pink / 02 Warm Pink</p>

<div class="price">
MRP: <del>₹250/-</del><br>
<span class="offer">Offer Price: ₹200/- (20% OFF)</span>
</div>

<p>Net Wt. 40g | With Sunscreen</p>

</body>
</html>
