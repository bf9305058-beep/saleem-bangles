<!DOCTYPE html><html><head><title>Bangles - Saleem Bangles</title><style>body{font-family:Arial;background:#fff0f5;margin:0;}.navbar{background:#0099ff;padding:12px;text-align:center;}.navbar a{color:white;margin:0 15px;text-decoration:none;font-weight:bold;}h1{text-align:center;color:#d63384;}.grid{display:flex;flex-wrap:wrap;gap:15px;padding:20px;justify-content:center;}.card{background:white;border-radius:10px;padding:10px;width:220px;box-shadow:0 2px 5px #ccc;text-align:center;}.card img{width:100%;border-radius:8px;height:220px;object-fit:cover;}.btn{background:#ff3399;color:white;border:none;padding:8px 15px;border-radius:5px;margin-top:5px;cursor:pointer;}.sizes span{border:1px solid #ccc;padding:2px 6px;margin:2px;border-radius:3px;font-size:12px;}</style></head><body><div class="navbar"><a href="index.html">Home</a><a href="bangles.html">Bangles</a><a href="cosmetics.html">Cosmetics</a></div><h1>👑 Bridal Bangles Collection 👑</h1><div class="grid" id="product-grid"></div><script>const products=[{name:"Pari Rang Sandook",price:2800,img:"pari-rang-sandook.jpg"},{name:"24 Dozen Fairy Box",price:4500,img:"24-dozen-fairy-box.jpg"},{name:"Viral Fairy Box",price:3400,img:"viral-fairy-box.jpg"},{name:"Sawan Special",price:399,img:"sawan-special.jpg"},{name:"Kashmiri Ghughru Set",price:299,img:"kashmiri-ghughru.jpg"},{name:"SRC Jelly Box",price:1399,img:"src-jelly-box.jpg"},{name:"Green Box",price:1799,img:"green-box.jpg"},{name:"Moti Box",price:1799,img:"moti-box.jpg"},{name:"Multi Box",price:2399,img:"multi-box.jpg"},{name:"Orange Moti",price:299,img:"orange-moti.jpg"},{name:"Blue Moti",price:299,img:"blue-moti.jpg"},{name:"Pink Moti",price:299,img:"pink-moti.jpg"},{name:"Moti Piccock",price:399,img:"moti-piccock.jpg"},{name:"Multi Moti 1",price:299,img:"multi-moti-1.jpg"},{name:"Multi Moti 2",price:299,img:"multi-moti-2.jpg"},{name:"Wine with Irani Kada",price:299,img:"wine-irani-kada.jpg"},{name:"Rangila Set",price:349,img:"rangila-set.jpg"},{name:"Bridal Pearl Kaleera",price:3999,img:"bridal-pearl-kaleera.jpg"},{name:"Mirror Stone Kada",price:399,img:"mirror-stone-kada.jpg"},{name:"Stone Kada",price:399,img:"stone-kada.jpg"}];let html="";products.forEach(p=>{html+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>₹${p.price}</p><div class="sizes">Size: <span>2.2</span><span>2.4</span><span>2.6</span><span>2.8</span></div><button class="btn">Add to Cart</button></div>`});document.getElementById("product-grid").innerHTML=html;</script></body></html>
