<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saleem Bangles</title>
<style>
body{font-family:Roboto; background:#f0f8ff; margin:0; padding:10px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.card{background:#fff; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px #ccc}
.card img{width:100%; height:150px; object-fit:cover; border-radius:8px}
.price{color:#008cff; font-weight:bold; font-size:18px}
.size span{border:1px solid #ccc; padding:4px 8px; margin:2px; border-radius:5px; cursor:pointer; display:inline-block}
.size span.active{background:#ff4081; color:#fff; border-color:#ff4081}
.btn{background:#ff4081; color:#fff; border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold; margin-top:8px; cursor:pointer}
.cart-box{background:#fff; margin-top:15px; padding:15px; border-radius:10px; box-shadow:0 2px 5px #ccc}
.checkout{background:#fb641b; color:#fff; padding:12px; width:100%; border:none; border-radius:6px; font-weight:bold; font-size:16px; margin-top:10px}
</style>
</head>
<body>

<h2 style="text-align:center;">Saleem Bangles Collection</h2>

<div class="grid">
  <div class="card">
    <img src="https://i.ibb.co/XYZ/moti.jpg">
    <p><b>Moti Piccock</b><br><span class="price">₹399</span></p>
    <div class="size" id="size-Moti Piccock">
      <span onclick="selectSize('Moti Piccock','2.2',this)">2.2</span>
      <span onclick="selectSize('Moti Piccock','2.4',this)">2.4</span>
      <span onclick="selectSize('Moti Piccock','2.6',this)">2.6</span>
      <span onclick="selectSize('Moti Piccock','2.8',this)">2.8</span>
    </div>
    <button class="btn" onclick="addToCart('Moti Piccock',399)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://i.ibb.co/XYZ/multi1.jpg">
    <p><b>Multi Moti 1</b><br><span class="price">₹299</span></p>
    <div class="size" id="size-Multi Moti 1">
      <span onclick="selectSize('Multi Moti 1','2.2',this)">2.2</span>
      <span onclick="selectSize('Multi Moti 1','2.4',this)">2.4</span>
      <span onclick="selectSize('Multi Moti 1','2.6',this)">2.6</span>
      <span onclick="selectSize('Multi Moti 1','2.8',this)">2.8</span>
    </div>
    <button class="btn" onclick="addToCart('Multi Moti 1',299)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://i.ibb.co/XYZ/kada.jpg">
    <p><b>Mirror Stone Kada</b><br><span class="price">₹399</span></p>
    <div class="size" id="size-Mirror Stone Kada">
      <span onclick="selectSize('Mirror Stone Kada','2.4',this)">2.4</span>
      <span onclick="selectSize('Mirror Stone Kada','2.6',this)">2.6</span>
      <span onclick="selectSize('Mirror Stone Kada','2.8',this)">2.8</span>
    </div>
    <button class="btn" onclick="addToCart('Mirror Stone Kada',399)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://i.ibb.co/XYZ/stone.jpg">
    <p><b>Stone Kada</b><br><span class="price">₹399</span></p>
    <div class="size" id="size-Stone Kada">
      <span onclick="selectSize('Stone Kada','2.4',this)">2.4</span>
      <span onclick="selectSize('Stone Kada','2.6',this)">2.8</span>
      <span onclick="selectSize('Stone Kada','2.8',this)">2.8</span>
    </div>
    <button class="btn" onclick="addToCart('Stone Kada',399)">Add to Cart</button>
  </div>
</div>

<div class="cart-box">
<h3>🛒 Your Cart</h3>
<div id="cart-items">Cart khali hai</div>
</div>

<script>
let selected = {};
function selectSize(name,size,el){
  selected[name]=size;
  let p=el.parentElement;
  p.querySelectorAll('span').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}
function addToCart(name,price){
  let sz=selected[name];
  if(!sz){ alert(name+" ke liye Size chuno!"); return; }
  let cart=JSON.parse(localStorage.getItem("saleem_cart")||"[]");
  cart.push({name:name,size:sz,price:price});
  localStorage.setItem("saleem_cart",JSON.stringify(cart));
  showCart();
}
function showCart(){
  let cart=JSON.parse(localStorage.getItem("saleem_cart")||"[]");
  let div=document.getElementById("cart-items");
  if(cart.length==0){ div.innerHTML="Cart khali hai"; return; }
  let total=0; div.innerHTML="";
  cart.forEach((it,i)=>{
    total+=it.price;
    div.innerHTML+=`<div style="display:flex;justify-content:space-between;margin:5px 0;"><span>${it.name} - Size ${it.size}</span><span>₹${it.price} <button onclick="removeItem(${i})">X</button></span></div>`;
  });
  div.innerHTML+=`<hr><b>Total: ₹${total}</b><br>
  <a href="checkout.html"><button class="checkout">Proceed to Checkout - Payment 💳</button></a>
  <button onclick="clearCart()" style="width:100%;margin-top:8px;padding:8px;border:1px solid #ccc;background:#fff;border-radius:5px;">Clear Cart</button>`;
}
function removeItem(i){
  let cart=JSON.parse(localStorage.getItem("saleem_cart")||"[]");
  cart.splice(i,1); localStorage.setItem("saleem_cart",JSON.stringify(cart)); showCart();
}
function clearCart(){ localStorage.removeItem("saleem_cart"); showCart(); }
showCart();
</script>
</body>
</html>
