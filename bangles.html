<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleem Bangles</title>
<style>
body{font-family:Arial; background:#e6f7ff; margin:0; padding:0}
.header{background:#0099ff; color:white; text-align:center; padding:15px; font-size:22px; font-weight:bold}
h1{text-align:center; color:#0066cc; font-size:24px; margin:20px 0}
.products{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; padding:20px}
.card{border:1px solid #99ddff; padding:15px; border-radius:12px; background:white; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%; height:220px; object-fit:cover; border-radius:8px; cursor:pointer}
.card h3{margin:10px 0; color:#333; font-size:16px}
.card p{font-size:18px; color:#0099ff; font-weight:bold; margin:5px 0}
.btn-add{margin-top:8px; cursor:pointer; width:100%; padding:10px; background:#ff69b4; color:white; border:none; border-radius:8px; font-weight:bold;}
#cart{margin:20px; padding:20px; border:2px solid #ff69b4; border-radius:10px; background:white;}
#cart ul{list-style:none; padding:0;}
.footer{text-align:center; margin-top:20px; padding:20px; background:#ccefff; font-size:14px; line-height:1.6}
#productPopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;justify-content:center;align-items:center;}
#productPopup .popup-box{background:white;padding:20px;border-radius:10px;max-width:400px;text-align:center;}
#productPopup img{width:100%;border-radius:8px;}
</style>
</head>
<body>
<div class="header">Saleem Bangles 💙</div>
<h1>👑💍 Bridal Collection 💍👑</h1>
<div class="products" id="products"></div>

<div id="cart">
  <h2>🛒 Your Cart</h2>
  <ul id="cart-items"></ul>
  <p id="total" style="font-weight:bold; font-size:18px;"></p>
  <button id="whatsapp-btn" onclick="orderOnWhatsApp()" style="background:#25D366; color:white; padding:12px; border:none; width:100%; border-radius:8px; font-size:16px; margin-top:8px;">Order on WhatsApp</button>
  <a href="checkout.html"><button style="background:#fb641b; color:white; padding:12px; border:none; width:100%; border-radius:8px; font-size:16px; margin-top:8px; font-weight:bold;">Proceed to Checkout - Payment 💳</button></a>
  <button onclick="clearCart()" style="background:#fff; border:1px solid #ccc; padding:8px; width:100%; border-radius:8px; margin-top:8px;">Clear Cart</button>
</div>

<div id="productPopup">
  <div class="popup-box">
    <img id="popupImg">
    <h3 id="popupName"></h3>
    <p id="popupPrice"></p>
    <p id="popupSizes"></p>
    <button id="popupWhatsapp" style="background:#25D366;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;">WhatsApp pe Order Karein</button>
    <button onclick="closePopup()" style="margin-left:10px;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;">Band Karein</button>
  </div>
</div>

<div class="footer">
<b>Saleem Bangle Store</b><br>
A Complete Bangle Hub<br>
Prop: Mohd Saeed<br>
Amin Complex Shop No. 8 & 48, Basement<br>
Akbari Gate, Nakhas, Lucknow<br>
📞 7703067297
</div>

<script>
const products = [
  {name:"Pari Rang Sandook", price:3499, img:"pari-sandook.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"24 Dozen Fairy Box", price:4499, img:"24-fairy-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Viral Fairy Box", price:3499, img:"viral-fairy-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Sawan Special", price:399, img:"sawan-special.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Kashmiri Ghughru Set", price:299, img:"kashmiri-set.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"SRC Jelly Box", price:1399, img:"src-jelly-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Green Box", price:1799, img:"green-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Moti Box", price:1799, img:"moti-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Multi Box", price:3499, img:"multi-box.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Orange Moti", price:299, img:"orange-moti.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Blue Moti", price:299, img:"blue-moti.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Pink Moti", price:299, img:"pink-moti.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Moti Piccock", price:399, img:"moti-piccock.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Multi Moti 1", price:299, img:"multi-moti1.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Multi Moti 2", price:299, img:"multi-moti2.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Wine with Irani Kada", price:299, img:"wine-irani-kada.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Rangila Set", price:349, img:"rangila-bangle.jpg", sizes:["2.2","2.4","2.6","2.8"]},
  {name:"Bridal Pearl Kaleera", price:3999, img:"bridal kalira kada.jpg", sizes:["2.4","2.6","2.8"]},
  {name:"Mirror Stone Kada", price:399, img:"mirror stone kada.jpg", sizes:["2.4","2.6","2.8"]},
  {name:"Stone Kada", price:399, img:"stone kada.jpg", sizes:["2.4","2.6","2.8"]}
  {name:"meggie Zigzag Full Box", price:2999, img:"meggie-zigzag.jpg", sizes:["2.4","2.6","2.8"]},
];

let cart = JSON.parse(localStorage.getItem("saleem_cart")||"[]");
let selectedSizes = {};

function showProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";
  products.forEach((p,i) => {
    let sizeBtns = `<div style="margin:5px 0;">`;
    if(p.sizes){
      p.sizes.forEach(s => {
        sizeBtns += `<button onclick="selectSize(${i},'${s}',this)" style="margin:2px; padding:4px 8px; border:1px solid #ccc; border-radius:4px; background:#fff;">${s}</button>`;
      });
    }
    sizeBtns += `</div>`;
    container.innerHTML += `
      <div class="card">
      <img src="${p.img}" onclick="openPopup(${i})">
        <h3>${p.name}</h3>
        <p>₹${p.price}</p>
        ${sizeBtns}
        <button class="btn-add" onclick="addToCart(${i})">🛒 Add to Cart</button>
      </div>
    `;
  });
}
function selectSize(i, size, el){
  selectedSizes[i] = size;
  el.parentElement.querySelectorAll("button").forEach(b=>{b.style.background="#fff"; b.style.color="#000"});
  el.style.background="#ff69b4";
  el.style.color="white";
}
function addToCart(i) {
  let p = products[i];
  if(p.sizes && !selectedSizes[i]){
    alert("Pehle Size select karo ben! 👉 "+p.name);
    return;
  }
  let size = selectedSizes[i] || "";
  cart.push({name:p.name, price:p.price, size:size});
  localStorage.setItem("saleem_cart", JSON.stringify(cart));
  alert(p.name + " Size " + size + " cart me add ho gaya ✅");
  showCart();
}
function showCart() {
  let cartList = document.getElementById("cart-items");
  let total = 0;
  cartList.innerHTML = "";
  if(cart.length==0){
    cartList.innerHTML = "Cart khali hai";
    document.getElementById("total").innerText = "";
    return;
  }
  cart.forEach((item, idx) => {
    cartList.innerHTML += `<li>${item.name} Size ${item.size} - ₹${item.price} <button onclick="removeItem(${idx})" style="background:red;color:white;border:none;padding:3px 8px;border-radius:4px;...margin-left:10px;">🗑️</button></button></li>`;
    total += item.price;
  });
  document.getElementById("total").innerText = "Total: ₹" + total;
}
function removeItem(i){ cart.splice(i,1); localStorage.setItem("saleem_cart", JSON.stringify(cart)); showCart(); }
function clearCart(){ cart = []; localStorage.removeItem("saleem_cart"); showCart(); }
function orderOnWhatsApp() {
  if(cart.length == 0){ alert("Pehle cart me product add karo!"); return; }
  let number = "917703067297";
  let message = "Salam Saleem Bangles! Mujhe ye order karna hai:%0A%0A";
  cart.forEach(item => { message += `• ${item.name} Size ${item.size} - ₹${item.price}%0A`; });
  let total = cart.reduce((sum, item) => sum + item.price, 0);
  message += `%0ATotal: ₹${total}`;
  window.open(`https://wa.me/${number}?text=${message}`, '_blank');
}
function openPopup(index){
  let p = products[index];
  document.getElementById("popupImg").src = p.img;
  document.getElementById("popupName").innerText = p.name;
  document.getElementById("popupPrice").innerText = "₹" + p.price;
  document.getElementById("popupSizes").innerText = p.sizes? "Size: " + p.sizes.join(", ") : "";
  document.getElementById("popupWhatsapp").onclick = () => {
    let selSize = selectedSizes[index] || (p.sizes? p.sizes[0] : "");
    let msg = `Hello! Mujhe ${p.name} order karna hai. \nPrice: ₹${p.price} \nSize: ${selSize}`;
    window.open(`https://wa.me/917703067297?text=${encodeURIComponent(msg)}`, '_blank');
  }
  document.getElementById("productPopup").style.display = "flex";
}
function closePopup(){ document.getElementById("productPopup").style.display = "none"; }
showProducts();
showCart();
</script>
  <div style="text-align:center; margin:25px 0;">
<a href="cosmetics.html" style="background:#222; color:white; padding:10px 20px; border-radius:25px; text-decoration:none; display:inline-block;">← Back to Cosmetics</a>
</div>
</body>
</html>
