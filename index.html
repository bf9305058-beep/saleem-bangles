<!DOCTYPE html>
<html>
<head>
    <title>Saleem Bangles</title>
    <style>
        body {font-family: Arial; background: #f9f9f9; padding: 20px;}
        h1 {text-align: center; color: #d63384;}
        .grid {display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 900px; margin: auto;}
        .box {background: white; border: 1px solid #ddd; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .box img {width: 100%; height: 200px; object-fit: cover; border-radius: 8px;}
        .price {font-weight: bold; color: green; font-size: 18px;}
        button {background: #d63384; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px;}
    </style>
</head>
<body>
    <h1>Saleem Bangles Collection</h1>
    <div class="grid">
        
        <!-- PRODUCT 1 -->
        <div class="box">
            <img src="shahi rainbow.jpg">
            <h2>Shahi Rainbow Box</h2>
            <p>Size: 2.4, 2.6, 2.8</p>
            <p>18 Dozen | Glass Bangles</p>
            <p class="price">MRP: Rs. 5,200.00</p>
            <button>Order Now</button>
        </div>

        <!-- PRODUCT 2 -->
        <div class="box">
            <img src="jellybox.jpg">
            <h2>Jelly Bangle Box</h2>
            <p>Size: 2.4, 2.6, 2.8</p>
            <p>18 Dozen | Jelly Finish</p>
            <p class="price">MRP: Rs. 1,100.00</p>
            <button>Order Now</button>
        </div>

        <!-- PRODUCT 3 -->
        <div class="box">
            <img src="fairybox.jpg">
            <h2>Fairy Rainbow Box</h2>
            <p>Size: 2.4, 2.6</p>
            <p>18 Dozen | Multi Color</p>
            <p class="price">MRP: Rs. 4,500.00</p>
            <button>Order Now</button>
        </div>
        
    </div>
</body>
</html>
