<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleem Bangle Store</title>
<style>
body{font-family:Arial; background:#fff8f0; margin:0; padding:20px}
h1{text-align:center; color:#d6336c; font-size:28px}
.products{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:20px}
.card{border:1px solid #ffc2d1; padding:15px; border-radius:12px; background:white; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%; height:220px; object-fit:cover; border-radius:8px}
.card h3{margin:10px 0; color:#333; font-size:18px}
.card p{font-size:20px; color:#d6336c; font-weight:bold; margin:5px 0}
.footer{text-align:center; margin-top:40px; padding:20px; background:#ffe6ee; border-radius:10px; font-size:14px}
</style>
</head>
<body>
<h1>✨ Sawan Special Collection ✨</h1>
<div class="products" id="products"></div>

<div class="footer">
<b>Saleem Bangle Store</b><br>
A Complete Bangle Hub<br>
Prop: Mohd Saeed<br>
Amin Complex Shop No. 8 & 48, Basement<br>
Akbari Gate, Nakhas, Lucknow<br>
📞 7703067297
</div>

<script>
const products = [
{name:"Pari Rang Sandook", price:"₹2600", img:"pari-sandook.jpg"},
{name:"24 Dozen Fairy Box", price:"₹4500", img:"24-fairy-box.jpg"},
{name:"Viral Fairy Box", price:"₹3400", img:"viral-fairy-box.jpg"},
{name:"Sawan Special", price:"₹399", img:"sawan-special.jpg"},
{name:"Kashmiri Ghughru Set", price:"₹299", img:"kashmiri-set.jpg"},
{name:"SRC Jelly Box", price:"₹1399", img:"src-jelly-box.jpg"},
{name:"Green Box", price:"₹1799", img:"green-box.jpg"},
{name:"Moti Box", price:"₹1799", img:"moti-box.jpg"},
{name:"Multi Box", price:"₹2399", img:"multi-box.jpg"},
{name:"Orange Moti", price:"₹299", img:"orange-moti.jpg"},
{name:"Blue Moti", price:"₹299", img:"blue-moti.jpg"},
{name:"Pink Moti", price:"₹299", img:"pink-moti.jpg"},
{name:"Moti Piccock", price:"₹399", img:"moti-piccock.jpg"},
{name:"Insight Kajal", price:"₹130", img:"insight-kajal.jpg"},
{name:"Multi Moti", price:"₹299", img:"multi-moti.jpg"},
{name:"Transparent Jelly", price:"₹399", img:"transparent-jelly.jpg"},
{name:"Wine Bangle", price:"₹299", img:"wine-bangle.jpg"},
{name:"Rangila Bangle", price:"₹349", img:"rangila-bangle.jpg"}
];

const container = document.getElementById('products');
products.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.price}</p>
    </div>
  `;
});
</script>
</body>
</html>
