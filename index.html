<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleem Bangles - A Complete Bangle Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

body{
  font-family: 'Poppins', sans-serif; 
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  margin:0; 
  padding:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
}
.logo{
  font-size:42px;
  font-weight:700;
  color:white;
  text-shadow: 0 4px 15px rgba(0,0,0,0.3);
  margin-bottom:10px;
  letter-spacing:2px;
}
.logo span{
  color:#ffd700;
}
.welcome-box{
  background:rgba(255,255,255,0.95);
  padding:50px 40px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  max-width:550px;
  width:90%;
  backdrop-filter: blur(10px);
}
.welcome-box h2{
  color:#d63384;
  font-size:24px;
  margin-bottom:8px;
}
.welcome-box p{
  color:#666;
  font-size:15px;
  margin-bottom:35px;
}
.btn-container{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.btn{
  padding:20px 30px;
  font-size:22px;
  font-weight:700;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  letter-spacing:1px;
}
.btn:hover{
  transform: translateY(-4px) scale(1.02);
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}
.btn-bangles{
  background: linear-gradient(90deg, #0099ff, #00d4ff);
  color:white;
}
.btn-cosmetics{
  background: linear-gradient(90deg, #ff69b4, #ff1493);
  color:white;
}
.footer{
  text-align:center; 
  margin-top:30px; 
  padding:20px; 
  font-size:14px;
  color:white;
  text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div class="logo">SALeem <span>BANGLES</span> 💍</div>

<div class="welcome-box">
  <h2>✨ A Complete Bangle Hub ✨</h2>
  <p>Traditional & Modern Bangles + Cosmetics</p>
  
  <div class="btn-container">
    <button class="btn btn-bangles" onclick="window.location.href='bangles.html'">
      💍 SALEEM BANGLES
    </button>
    <button class="btn btn-cosmetics" onclick="window.location.href='cosmetics.html'">
      💄 COSMETICS
    </button>
  </div>
</div>

<div class="footer">
<b>📍 Amin Complex Shop No. 8 & 48, Basement, Akbari Gate, Nakhas, Lucknow</b><br>
📞 7703067297 | Prop: Mohd Saeed
</div>

</body>
</html>
