<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleem Bangles - Sawan Special</title>
<style>
  body { font-family: Arial, sans-serif; background: #e6f7ff; margin:0; padding:0; }
 .header { background:#4da3ff; padding:12px; color:white; text-align:center; font-size:20px; font-weight:bold; }
  h1 { text-align:center; color:#2874f0; padding:20px 0 10px; }
 .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; padding:20px; max-width:1200px; margin:auto; }
 .product { background:white; border-radius:10px; padding:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
 .main-img { width:100%; height:240px; object-fit:cover; border-radius:8px; }
 .tag { background:#e6f7ff; color:#4da3ff; padding:3px 8px; border-radius:12px; font-size:11px; display:inline-block; margin:5px 0; }
  h3 { margin:8px 0 4px; color:#212121; font-size:16px; }
  p { margin:0 0 8px; color:#878787; font-size:13px; }
 .price { font-size:18px; font-weight:bold; color:#4da3ff; margin:8px 0; }
 .size-title { font-size:13px; font-weight:bold; margin:10px 0 5px; }
 .size-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
 .size-btn { padding:6px 10px; border:1px solid #ddd; background:white; border-radius:20px; font-size:12px; cursor:pointer; }
 .size-btn.active { background:#4da3ff; color:white; border-color:#4da3ff; }
 .btns { display:flex; gap:8px; margin-top:10px; }
 .btn { flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px; }
 .btn-cart { background:#ff9f00; color:white; }
 .btn-buy { background:#fb641b; color:white; }
</style>
</head>
<body>

<div class="header">Saleem Bangles 💙</div>
<h1>🌿 Sawan Special Collection 🌿</h1>
<div class="products" id="products"></div>

<script>
const products = [
  {name:"Pari Rang Sandook", price:2600, img:"pari-sandook.jpg", tag:""},
  {name:"24 Dozen Fairy Box", price:4500, img:"24-fairy-box.jpg", tag:"✨"},
  {name:"Viral Fairy Box", price:3400, img:"viral-fairy-box.jpg", tag:"✨😍 (bestseller)"},
  {name:"Sawan Special", price:399, img:"sawan-special.jpg", tag:"🌿"},
  {name:"Kashmiri Ghughru Set", price:299, img:"kashmiri-set.jpg", tag:""},
  {name:"SRC Jelly Box", price:1399, img:"src-jelly-box.jpg", tag:""},
  {name:"Green Box", price:1799, img:"green-box.jpg", tag:""},
  {name:"Moti Box", price:229, img:"moti-box.jpg", tag:""},
  {name:"Multi Box", price:2399, img:"multi-box.jpg", tag:""},
  {name:"Orange Moti", price:299, img:"orange-moti.jpg", tag:""},
  {name:"Blue Moti", price:209, img:"blue-moti.jpg", tag:""},
  {name:"Pink Moti", price:209, img:"pink-moti.jpg", tag:""},
  {name:"Moti Piccock", price:349, img:"moti-piccock.jpg", tag:""},
  {name:"Insight Kajal", price:99, img:"insight-kajal.jpg", tag:""},
  {name:"Multi Moti 1", price:239, img:"multi-moti1.jpg", tag:""},
  {name:"Multi Moti 2", price:239, img:"multi-moti2.jpg", tag:""},
  {name:"Transparent Jelly", price:169, img:"transparent-jelly.jpg", tag:""}
];

let selectedSize = {};

function render(){
  let html = "";
  products.forEach((p,i)=>{
    selectedSize[i] = "2.4";
    html += `
    <div class="product">
      <img src="${p.img}" class="main-img">
      ${p.tag? `<div class="tag">${p.tag}</div>` : ""}
      <h3>${p.name}</h3>
      <p>Glass Bangle Set</p>
      <div class="price">Rs. ${p.price}.00</div>
      <div class="size-title">Size</div>
      <div class="size-btns">
        <button class="size-btn active" onclick="selectSize(${i},'2.2',this)">2.2</button>
        <button class="size-btn" onclick="selectSize(${i},'2.4',this)">2.4</button>
        <button class="size-btn" onclick="selectSize(${i},'2.6',this)">2.6</button>
        <button class="size-btn" onclick="selectSize(${i},'2.8',this)">2.8</button>
      </div>
      <div class="btns">
        <button class="btn btn-cart" onclick="addCart('${p.name}')">Add to cart</button>
        <button class="btn btn-buy" onclick="order('${p.name}',${p.price},'${p.img}',${i})">Buy at Rs.${p.price}</button>
      </div>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}

function selectSize(i, size, el){
  selectedSize[i] = size;
  el.parentElement.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function order(name, price, img, i) {
  let size = selectedSize[i];
  let myNumber = "917703067297";
  let photoLink = `${window.location.origin}/${img}`;
  let message = `*New Order From Saleem Bangles*%0A%0A*Product:* ${name}%0A*Size:* ${size}%0A*Price:* Rs.${price}%0A%0A*Photo:*%0A${photoLink}%0A%0AAddress bhej dijiye 🙏`;
  window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
}

function addCart(name){
  alert(name + " cart me add ho gaya!");
}

render();
</script>
</body>
</html>
