<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleem Bangles - Sawan Special</title>
<style>
  body { font-family: Arial, sans-serif; background: #f1f3f6; margin:0; padding:0; }
  .header { background:#2874f0; padding:12px; color:white; text-align:center; font-size:20px; font-weight:bold; }
  h1 { text-align:center; color:#d6336c; padding:20px 0 10px; }
  .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; padding:20px; max-width:1200px; margin:auto; }
  .product { background:white; border-radius:4px; padding:15px; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .product:hover { box-shadow:0 3px 8px rgba(0,0,0,0.2); }
  .main-img { width:100%; height:220px; object-fit:cover; border-radius:4px; }
  .badges { margin:8px 0; }
  .badge { display:inline-block; background:#e6f3ff; color:#2874f0; padding:3px 6px; border-radius:3px; font-size:11px; margin-right:4px; }
  select { width:100%; padding:8px; margin:8px 0; border-radius:4px; border:1px solid #ccc; }
  .sizes { margin:8px 0; }
  .size-btn { padding:5px 10px; border:1px solid #ddd; background:white; border-radius:4px; font-size:12px; }
  .size-btn.active { background:#2874f0; color:white; border-color:#2874f0; }
  h3 { margin:8px 0 4px; color:#212121; font-size:16px; }
  p { margin:0 0 8px; color:#878787; font-size:13px; }
  .price { font-size:18px; font-weight:bold; color:#212121; margin:8px 0; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; padding:10px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; }
  .btn-cart { background:#ff9f00; color:white; }
  .btn-buy { background:#fb641b; color:white; }
</style>
</head>
<body>

<div class="header">Saleem Bangles</div>
<h1>🌿 Sawan Special Collection 🌿</h1>
<div class="products" id="products"></div>

<script>
const products = [
  {name:"Sawan Special", price:399, img:"sawan-special.jpg"},
  {name:"Kashmiri Ghughru Set", price:299, img:"kashmiri-set.jpg"},
  {name:"SRC Jelly Box", price:1399, img:"src-jelly-box.jpg"},
  {name:"Green Box", price:1799, img:"green-box.jpg"},
  {name:"Fairy Box", price:4399, img:"fairy-box.jpg"},
  {name:"Moti Box", price:1899, img:"moti-box.jpg"},
  {name:"Multi Box", price:2399, img:"multi-box.jpg"},
  {name:"Orange Moti", price:299, img:"orange-moti.jpg"},
  {name:"Blue Moti", price:299, img:"blue-moti.jpg"},
  {name:"Pink Moti", price:299, img:"pink-moti.jpg"},
  {name:"Moti Piccock", price:299, img:"moti-piccock.jpg"},
  {name:"Insight Kajal", price:130, img:"insight-kajal.jpg"},
  {name:"Multi Moti 1", price:299, img:"multi-moti1.jpg"},
  {name:"Multi Moti 2", price:299, img:"multi-moti2.jpg"},
  {name:"Transparent Jelly", price:399, img:"transparent-jelly.jpg"}
];

function render(){
  let html = "";
  products.forEach((p,i)=>{
    html += `
    <div class="product">
      <img src="${p.img}" class="main-img" id="main${i}">
      <div class="badges">
        <div class="badge">🌿 Traditional</div>
        <div class="badge">✨ Sawan Special</div>
      </div>

      <b style="font-size:13px;">Selected Size:</b>
      <select id="size${i}">
        <option>Size Select karein</option>
        <option>2.2</option><option>2.4</option><option>2.6</option><option>2.8</option>
      </select>

      <b style="font-size:13px;">Pack Of:</b>
      <div class="sizes">
        <button class="size-btn active">18</button>
      </div>

      <h3>${p.name}</h3>
      <p>Glass Bangle Set</p>
      
      <div class="price">₹${p.price}</div>
      
      <div class="btns">
        <button class="btn btn-cart" onclick="addCart('${p.name}')">Add to cart</button>
        <button class="btn btn-buy" onclick="order('${p.name}',${p.price},'${p.img}','size${i}')">Buy at ₹${p.price}</button>
      </div>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}

function order(name, price, img, sizeId) {
  let size = document.getElementById(sizeId).value;
  if(size == "Size Select karein") { alert("Pehle size select karein"); return; }
  let myNumber = "917703067297";
  let photoLink = `${window.location.origin}/${img}`;
  let message = `*New Order From Saleem Bangles*%0A%0A*Product:* ${name}%0A*Size:* ${size}%0A*Price:* ₹${price}%0A%0A*Photo:*%0A${photoLink}%0A%0AAddress bhej dijiye 🙏`;
  window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
}

function addCart(name){
  alert(name + " cart me add ho gaya!");
}

render();
</script>
</body>
</html>
